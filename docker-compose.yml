version: '3'

services: 
  db:
    image: postgres:14
    container_name: origenes_sv
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: devops_db
    ports: 
      - 3031:5432 
    volumes: 
      - ./data:/var/lib/postgresql/data

  db_e2e:
    image: postgres:14
    container_name: origenes_sv_e2e
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: origenes_sv_e2e
    ports:
      - 3032:5432 

  pgadmin: 
    image: dpage/pgadmin4
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports: 
      - 5050:80
